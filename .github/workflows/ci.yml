name: baen-economy-engine CI

on:
  push:
    branches:
      - main
      - codex/reconcile-standalone-authority-20260917
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baen-economy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact Mesa upstream product on Python 3.12
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mesa]'
      - name: Compile Python source, tests, and tools
        run: python -m compileall -q src tests tools
      - name: Run public standalone regression suite
        env:
          PYTHONPATH: src
        run: python tools/run_standalone_tests.py
      - name: Verify import surface
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import sys
          import baen_economy
          import baen_economy.http_api
          import baen_economy.operator_cli
          import baen_economy.food_cli
          import baen_economy.whole_economy_cli
          if sys.version_info >= (3, 12):
              import mesa
              assert mesa.__version__ == baen_economy.MESA_VERSION
              assert baen_economy.mesa_available()
              print("pinned Mesa product runtime OK", mesa.__version__)
          print("standalone import surface OK")
          PY

  brunnfeld-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Clone and build exact pinned Brunnfeld product
        run: python tools/run_brunnfeld_sidecar.py --checkout "$RUNNER_TEMP/brunnfeld" --build-only
      - name: Boot actual Brunnfeld HTTP product and verify published API
        env:
          PORT: "3333"
        run: |
          cd "$RUNNER_TEMP/brunnfeld"
          npm run server > "$RUNNER_TEMP/brunnfeld-server.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3333/api/villages > "$RUNNER_TEMP/villages.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/villages.json" || { cat "$RUNNER_TEMP/brunnfeld-server.log"; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'villages.json').read_text())
          assert isinstance(data, list)
          print('actual Brunnfeld sidecar API OK; villages:', len(data))
          PY

  unknown-horizons-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire exact pinned Unknown Horizons product
        run: python tools/prepare_unknown_horizons_product.py --checkout "$RUNNER_TEMP/unknown-horizons"
      - name: Execute actual Unknown Horizons ProductionLine through process bridge
        env:
          PYTHONPATH: src
          UNKNOWN_HORIZONS_CHECKOUT: ${{ runner.temp }}/unknown-horizons
        run: |
          python -m unittest -v tests.test_unknown_horizons_product.UnknownHorizonsProductTests.test_actual_pinned_product_executes_production_line
          python - <<'PY'
          import os
          from baen_economy.unknown_horizons_product import run_unknown_horizons_production_line
          result = run_unknown_horizons_production_line(
              os.environ['UNKNOWN_HORIZONS_CHECKOUT'],
              line_id=901,
              produces=((1, 4.0),),
              consumes=((2, -2.0),),
              time=3.0,
          )
          assert result.production == {1: 4.0, 2: -2.0}
          assert result.produced == {1: 4.0}
          assert result.consumed == {2: -2.0}
          assert result.canonical_time_advanced is False
          print('actual Unknown Horizons ProductionLine OK', result)
          PY

  freecol-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install Ant
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant
      - name: Acquire and build exact pinned FreeCol product
        run: python tools/prepare_freecol_product.py --checkout "$RUNNER_TEMP/freecol"
      - name: Execute actual FreeCol ProductionInfo through JVM bridge
        env:
          PYTHONPATH: src
          FREECOL_CHECKOUT: ${{ runner.temp }}/freecol
        run: |
          python -m unittest -v tests.test_freecol_product.FreeColProductTests.test_actual_pinned_product_executes_production_info
          python - <<'PY'
          import os
          from baen_economy.freecol_product import run_freecol_production_info
          result = run_freecol_production_info(
              os.environ['FREECOL_CHECKOUT'],
              actual={'model.goods.grain': 7, 'model.goods.tools': 4},
              maximum={'model.goods.grain': 11, 'model.goods.tools': 4},
          )
          assert result.deficits == {'model.goods.grain': 4}
          assert result.canonical_time_advanced is False
          print('actual FreeCol ProductionInfo OK', result)
          PY

  openttd-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenTTD build and free-base-set dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake openttd-opengfx openttd-opensfx openttd-openmsx
      - name: Acquire and build exact pinned OpenTTD dedicated product
        run: python tools/prepare_openttd_product.py --checkout "$RUNNER_TEMP/openttd" --jobs 2
      - name: Boot actual OpenTTD and probe documented admin economy API
        env:
          PYTHONPATH: src
        run: |
          test -d /usr/share/games/openttd/baseset
          python tools/probe_openttd_product.py \
            --checkout "$RUNNER_TEMP/openttd" \
            --baseset-dir /usr/share/games/openttd/baseset \
            --admin-port 3977 \
            --server-port 3979

  veloren-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Veloren native linker dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold
      - name: Acquire pinned Veloren and build minimal GPL-side economy bridge
        run: python tools/prepare_veloren_product.py --checkout "$RUNNER_TEMP/veloren" --toolchain nightly
      - name: Execute actual Veloren Economy tick through patched product bridge
        env:
          PYTHONPATH: src
          VELOREN_CHECKOUT: ${{ runner.temp }}/veloren
        run: |
          python -m unittest -v tests.test_veloren_product.VelorenProductTests.test_actual_veloren_economy_tick_executes
          python - <<'PY'
          import os
          from baen_economy.veloren_product import run_veloren_economy
          result = run_veloren_economy(
              os.environ['VELOREN_CHECKOUT'],
              population=64,
              food_stock=500,
              coin_stock=1000,
              days=30,
              timeout=60,
          )
          assert result.upstream == 'Veloren'
          assert result.population >= 0
          assert result.food_stock >= 0
          assert result.food_price > 0
          assert result.canonical_time_advanced is False
          print('actual Veloren Economy tick OK', result)
          PY


  empire-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install product build/runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant build-essential cmake mold openttd-opengfx openttd-opensfx openttd-openmsx
          python -m pip install --upgrade pip
          python -m pip install -e '.[mesa]'
      - name: Execute the exact user-facing whole-Empire command
        run: |
          mkdir -p reports
          baen-empire run \
            --seed "hammer-1495-e2e" \
            --product-root "$RUNNER_TEMP/baen-product-stack" \
            --openttd-baseset /usr/share/games/openttd/baseset \
            --build-jobs 2 \
            --format report | tee reports/Empire-E2E-Preview.md
          test -s reports/Empire-E2E-Preview.md
          grep -q "Whole-Economy Month" reports/Empire-E2E-Preview.md
          grep -q "mesa.*USED_IN_RUN" reports/Empire-E2E-Preview.md
          grep -q "brunnfeld.*USED_IN_RUN" reports/Empire-E2E-Preview.md
          grep -q "unknown_horizons.*USED_IN_RUN" reports/Empire-E2E-Preview.md
          grep -q "freecol.*USED_IN_RUN" reports/Empire-E2E-Preview.md
          grep -q "veloren.*USED_IN_RUN" reports/Empire-E2E-Preview.md
          grep -q "openttd.*USED_IN_RUN" reports/Empire-E2E-Preview.md

